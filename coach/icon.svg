<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e9fb"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- 텍스트 라인 (글쓰기) -->
  <g fill="#ffffff" opacity="0.96">
    <rect x="232" y="560" width="430" height="46" rx="23"/>
    <rect x="232" y="652" width="500" height="46" rx="23"/>
    <rect x="232" y="744" width="300" height="46" rx="23"/>
  </g>

  <!-- 펜 (오른쪽 위 → 텍스트 쪽으로) -->
  <g transform="rotate(41 620 400)">
    <!-- 몸통 -->
    <rect x="566" y="150" width="108" height="430" rx="26" fill="url(#pen)"/>
    <!-- 상단 밴드(악센트) -->
    <rect x="566" y="150" width="108" height="70" rx="26" fill="#0e9488"/>
    <!-- 중간 분리선 -->
    <rect x="566" y="470" width="108" height="14" fill="#4f46e5" opacity="0.35"/>
    <!-- 촉 -->
    <path d="M566 580 L674 580 L620 700 Z" fill="url(#pen)"/>
    <path d="M604 656 L636 656 L620 700 Z" fill="#3730a3"/>
  </g>
</svg>
